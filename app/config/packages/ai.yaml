ai:
    platform:
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges
        ollama:
            # Endpoint for Ollama (e.g. "http://127.0.0.1:11434" for local, or a cloud endpoint). If null, the http_client is used as-is and must already be configured with a base URI.
            endpoint: "%env(OLLAMA_HOST_URL)%"
        # openai:
        #    api_key: '%env(OPENAI_API_KEY)%'

    agent:
        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html

        # default:
        #    platform: 'ai.platform.openai'
        #    model: 'gpt-5-mini'
        #    prompt: |
        #        You are a pirate and you write funny.
        #    tools:
        #        - 'Symfony\AI\Agent\Bridge\Clock\Clock'

        default:
            platform: "ai.platform.ollama"
            model: "qwen2.5:3b"
            prompt: |
                Jesteś agentem klasyfikującym zgłoszenia pracowników do właściwego działu firmy.
                Dostępne adresy docelowe: human-resources@example.com, help-desk@example.com,
                it@example.com, kadry@example.com, other@example.com (fallback dla niejasnych zgłoszeń).
                Przeanalizuj treść zgłoszenia i wyślij je pod właściwy adres, korzystając
                z dostępnego narzędzia do wysyłki e-mail. Zawsze wybierz dokładnie jeden adres
                z powyższej listy — nigdy nie wymyślaj innego adresu.
            tools:
                - 'App\Tool\SendDepartmentEmailTool'

    store:
        # Store configuration

        # chromadb:
        #    default:
        #        client: 'client.service.id'
        #        collection: 'my_collection'
